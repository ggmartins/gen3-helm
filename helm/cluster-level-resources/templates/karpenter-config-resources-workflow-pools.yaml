{{ if and (index $.Values "karpenter-crds" "enabled") (index $.Values "karpenter-crds" "workflow" "enabled") }}
{{- $workflow := index $.Values "karpenter-crds" "workflow" }}
{{- $pools := $workflow.pools | default (list (dict "namespace" ($workflow.namespace | default "") "costTag" ($workflow.costTag | default dict))) }}
{{- range $pool := $pools }}
{{- $namespace := $pool.namespace | default "" }}
{{- if and $workflow.pools (not $namespace) }}
{{- fail "Each karpenter-crds.workflow.pools entry requires namespace" }}
{{- end }}
{{- $poolName := "workflow" }}
{{- if $namespace }}
{{- $poolName = printf "workflow-%s" $namespace }}
{{- end }}
{{- $costTag := $pool.costTag | default dict }}
{{- $costTagKey := $costTag.key | default "KubernetesNamespace" }}
{{- $costTagValue := $costTag.value | default $namespace }}
---
{{- if semverCompare ">=1.0.8-0" $.Values.karpenter.targetRevision }}
apiVersion: karpenter.k8s.aws/v1
{{- else }}
apiVersion: karpenter.k8s.aws/v1beta1
{{- end }}
kind: EC2NodeClass
metadata:
  name: {{ $poolName }}
spec:
  {{- if semverCompare ">=1.33.0-0" $.Capabilities.KubeVersion.Version }}
  amiFamily: AL2023
  {{- else }}
  amiFamily: AL2
  {{- end }}
  amiSelectorTerms:
  {{- if not (index $.Values "karpenter-crds" "useAlias") }}
  - name: {{ index $.Values "karpenter-crds" "amiSelectorName" }}
    owner: {{ index $.Values "karpenter-crds" "amiOwner" | quote }}
  {{- else }}
  - alias: {{ index $.Values "karpenter-crds" "alias" | quote }}
  {{- end }}
  blockDeviceMappings:
  - deviceName: /dev/xvda
    ebs:
      deleteOnTermination: true
      encrypted: true
      volumeSize: {{ index $.Values "karpenter-crds" "workflow" "volumeSize" }}
      volumeType: gp3
{{ if and (semverCompare ">=1.33.0-0" $.Capabilities.KubeVersion.Version) (index $.Values "karpenter-crds" "workflow" "fastImagePull" "enabled") }}
      iops: {{ index $.Values "karpenter-crds" "workflow" "fastImagePull" "iops" }}
      throughput: {{ index $.Values "karpenter-crds" "workflow" "fastImagePull" "throughput" }}
{{ end }}
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: optional
  role: eks_{{ index $.Values "karpenter-crds" "selectorTag" }}_workers_role

  securityGroupSelectorTerms:
  - tags:
    {{- if ne (index $.Values "karpenter-crds" "workflow" "sgSelector") "" }}
      karpenter.sh/discovery: {{ index $.Values "karpenter-crds" "workflow" "sgSelector" }}
    {{- else }}
      karpenter.sh/discovery: {{ index $.Values "karpenter-crds" "selectorTag" }}
    {{- end }}

  subnetSelectorTerms:
  - tags:
     karpenter.sh/discovery: {{ index $.Values "karpenter-crds" "selectorTag" }}

  {{- $tags := dict
        "Environment" $.Values.cluster
        "Name" (printf "eks-%s-%s" $.Values.cluster $poolName)
        "karpenter.sh/discovery" (index $.Values "karpenter-crds" "selectorTag")
        "purpose" "workflow"
  }}
  {{- range $key, $value := ($workflow.additionalTags | default dict) }}
  {{- $_ := set $tags $key (toString $value) }}
  {{- end }}
  {{- if $namespace }}
  {{- $_ := set $tags $costTagKey (toString $costTagValue) }}
  {{- end }}
  tags:
    {{- range $key, $value := $tags }}
    {{ $key | quote }}: {{ $value | toString | quote }}
    {{- end }}

  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="BOUNDARY"

    --BOUNDARY
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash -x
    echo "$(jq '.registryPullQPS=0' /etc/kubernetes/kubelet/kubelet-config.json)" > /etc/kubernetes/kubelet/kubelet-config.json
    curl https://raw.githubusercontent.com/uc-cdis/cloud-automation/master/files/authorized_keys/ops_team >> /home/ec2-user/.ssh/authorized_keys &
    sysctl -w fs.inotify.max_user_watches=12000 &
    systemctl stop firewalld
    systemctl disable firewalld
{{ if and (semverCompare ">=1.33.0-0" $.Capabilities.KubeVersion.Version) (index $.Values "karpenter-crds" "workflow" "fastImagePull" "enabled") }}

    --BOUNDARY
    Content-Type: application/node.eks.aws

    ---
    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      featureGates:
        FastImagePull: true
{{ end }}

    --BOUNDARY--

{{- if semverCompare ">=1.0.8-0" $.Values.karpenter.targetRevision }}
  kubelet:
    evictionHard:
      memory.available: 5%
    evictionSoft:
      memory.available: 10%
    evictionSoftGracePeriod:
      memory.available: 5m
{{- end }}
---
{{- if semverCompare ">=1.0.8-0" $.Values.karpenter.targetRevision }}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ $poolName }}
spec:
  template:
    metadata:
      labels:
        role: workflow
        {{- if $namespace }}
        billing.gen3.org/namespace: {{ $namespace | quote }}
        {{- end }}
    spec:
      taints:
      - effect: NoSchedule
        key: role
        value: workflow
      {{- if $namespace }}
      - effect: NoSchedule
        key: billing.gen3.org/namespace
        value: {{ $namespace | quote }}
      {{- end }}
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: {{ $poolName }}
      expireAfter: 168h
      terminationGracePeriod: 48h
      requirements:
      {{ toYaml (index $.Values "karpenter-crds" "workflow" "requirements") | nindent 6 }}


  disruption:
    consolidateAfter: {{ index $.Values "karpenter-crds" "default" "consolidateAfter" }}
    consolidationPolicy: {{ index $.Values "karpenter-crds" "default" "consolidationPolicy" }}
    budgets:
    - nodes: 10%

  limits:
    cpu: "1000"
    memory: 1000Gi
{{- else }}
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: {{ $poolName }}
spec:
  disruption:
    {{ if eq (index $.Values "karpenter-crds" "workflow" "consolidationPolicy" ) "WhenEmpty" }}
    consolidateAfter: {{ index $.Values "karpenter-crds" "workflow" "consolidateAfter" }}
    {{ end }}
    consolidationPolicy: {{ index $.Values "karpenter-crds" "workflow" "consolidationPolicy" }}
    expireAfter: {{ index $.Values "karpenter-crds" "workflow" "expireAfter" }}
  limits:
    cpu: "1000"
    memory: 1000Gi
  template:
    metadata:
      labels:
        role: workflow
        {{- if $namespace }}
        billing.gen3.org/namespace: {{ $namespace | quote }}
        {{- end }}
    spec:
      kubelet:
        evictionHard:
          memory.available: 5%
        evictionSoft:
          memory.available: 10%
        evictionSoftGracePeriod:
          memory.available: 5m
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: {{ $poolName }}
      requirements:
      {{ toYaml (index $.Values "karpenter-crds" "workflow" "requirements") | nindent 6 }}
      taints:
      - effect: NoSchedule
        key: role
        value: workflow
      {{- if $namespace }}
      - effect: NoSchedule
        key: billing.gen3.org/namespace
        value: {{ $namespace | quote }}
      {{- end }}
{{- end }}
{{ end }}
{{- end }}
