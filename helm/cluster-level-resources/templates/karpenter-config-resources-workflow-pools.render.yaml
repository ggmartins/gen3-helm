#helm template cluster-resources ./helm/cluster-level-resources \
#  --kube-version 1.33.0 \
#  --set-string cluster=my-eks-cluster \
#  --set karpenter-crds.enabled=true \
#  --set karpenter-crds.workflow.enabled=true \
#  --set-string karpenter-crds.selectorTag=my-eks-cluster \
#  --set-string 'karpenter-crds.workflow.additionalTags.CostCenter=research' \
#  --set-string 'karpenter-crds.workflow.pools[0].namespace=research-a' \
#  --set-string 'karpenter-crds.workflow.pools[0].costTag.key=KubernetesNamespace' \
#  --set-string 'karpenter-crds.workflow.pools[0].costTag.value=research-a' \
#  --set-string 'karpenter-crds.workflow.pools[1].namespace=research-b' \
#  --set-string 'karpenter-crds.workflow.pools[1].costTag.key=KubernetesNamespace' \
#  --set-string 'karpenter-crds.workflow.pools[1].costTag.value=research-b' \
#  --show-only templates/karpenter-config-resources-workflow.yaml \
#  > /tmp/karpenter-config-resources-workflow-pools.render.yaml

---
# Source: cluster-level-resources/templates/karpenter-config-resources-workflow.yaml
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: workflow-research-a
spec:
  amiFamily: AL2023
  amiSelectorTerms:
  - name: EKS-FIPS*
    owner: "143731057154"
  blockDeviceMappings:
  - deviceName: /dev/xvda
    ebs:
      deleteOnTermination: true
      encrypted: true
      volumeSize: 50Gi
      volumeType: gp3

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: optional
  role: eks_my-eks-cluster_workers_role

  securityGroupSelectorTerms:
  - tags:
      karpenter.sh/discovery: my-eks-cluster

  subnetSelectorTerms:
  - tags:
     karpenter.sh/discovery: my-eks-cluster
  tags:
    "CostCenter": "research"
    "Environment": "my-eks-cluster"
    "KubernetesNamespace": "research-a"
    "Name": "eks-my-eks-cluster-workflow-research-a"
    "karpenter.sh/discovery": "my-eks-cluster"
    "purpose": "workflow"

  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="BOUNDARY"

    --BOUNDARY
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash -x
    echo "$(jq '.registryPullQPS=0' /etc/kubernetes/kubelet/kubelet-config.json)" > /etc/kubernetes/kubelet/kubelet-config.json
    curl https://raw.githubusercontent.com/uc-cdis/cloud-automation/master/files/authorized_keys/ops_team >> /home/ec2-user/.ssh/authorized_keys &
    sysctl -w fs.inotify.max_user_watches=12000 &
    systemctl stop firewalld
    systemctl disable firewalld


    --BOUNDARY--
  kubelet:
    evictionHard:
      memory.available: 5%
    evictionSoft:
      memory.available: 10%
    evictionSoftGracePeriod:
      memory.available: 5m


