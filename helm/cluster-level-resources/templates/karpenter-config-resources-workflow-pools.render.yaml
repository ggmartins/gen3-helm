---
# Source: cluster-level-resources/templates/karpenter-config-resources-workflow.yaml
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: workflow-research-a
spec:
  template:
    metadata:
      labels:
        role: workflow
        billing.gen3.org/namespace: "research-a"
    spec:
      taints:
      - effect: NoSchedule
        key: role
        value: workflow
      - effect: NoSchedule
        key: billing.gen3.org/namespace
        value: "research-a"
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: workflow-research-a
      expireAfter: 168h
      terminationGracePeriod: 48h
      requirements:
      
      - key: karpenter.sh/capacity-type
        operator: In
        values:
        - on-demand
      - key: kubernetes.io/arch
        operator: In
        values:
        - amd64
      - key: karpenter.k8s.aws/instance-category
        operator: In
        values:
        - c
        - m
        - r
        - t


  disruption:
    consolidateAfter: 30s
    consolidationPolicy: WhenEmpty
    budgets:
    - nodes: 10%

  limits:
    cpu: "1000"
    memory: 1000Gi



